server {
    listen 80 default_server;
    server_name _;

    gzip on;
    client_max_body_size 10M;

    location / {
        root /frontend;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        # Resolve the backend through Docker's DNS on every request (cached
        # for 10s) instead of once at startup, so recreating the backend
        # container, which gives it a new IP, doesn't leave nginx proxying to
        # the old one with 502s until nginx itself is restarted.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:5000;

        # With a variable in proxy_pass nginx no longer swaps the /api prefix
        # for "/", so strip it here: /api/x -> /x, /api -> /
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    location /dummy-wca {
        # docker resolver
        resolver 127.0.0.11 valid=30s;

        set $upstream_appdw dummy_wca;
        set $upstream_portdw 3000;
        set $upstream_protodw http;
        rewrite ^/dummy-wca(/.*)$ $1 break;
        rewrite ^/dummy-wca$ / break;
        proxy_pass $upstream_protodw://$upstream_appdw:$upstream_portdw;

        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /dummy-wca-live {
        # docker resolver
        resolver 127.0.0.11 valid=30s;

        set $upstream_appdl dummy_wca_live;
        set $upstream_portdl 4000;
        set $upstream_protodl http;
        rewrite ^/dummy-wca-live(/.*)$ $1 break;
        rewrite ^/dummy-wca-live$ / break;
        proxy_pass $upstream_protodl://$upstream_appdl:$upstream_portdl;

        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
