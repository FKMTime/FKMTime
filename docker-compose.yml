services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - sock:/app/sock
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    environment:
      - DATABASE_URL=postgres://root:password@database:5432/fkm_time
      - SECRET=dev-only-secret-not-for-production-change-me
      - WCA_LIVE_API_ORIGIN=http://dummy_wca_live:4000/api
      - WCA_ORIGIN=http://dummy_wca:3000
      - WCA_CLIENT_ID=example-application-id
      - WCA_CLIENT_SECRET=example-secret
      - SOCKET_PATH=/app/sock/socket.sock
    ports:
      - "${FKMTIME_BACKEND_PORT:-5000}:5000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 5s
      timeout: 20s
      retries: 50

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      - VITE_BACKEND_ORIGIN=http://localhost:${FKMTIME_BACKEND_PORT:-5000}
      - VITE_WCA_ORIGIN=http://127.0.0.1:${FKMTIME_DUMMY_WCA_PORT:-3005}
      - VITE_GIT_COMMIT=dummy-commit
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    ports:
      - "${FKMTIME_FRONTEND_PORT:-5173}:5173"
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1

  database:
    image: postgres:18-alpine
    ports:
      - "${FKMTIME_DATABASE_PORT:-5433}:5432"
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=fkm_time
    volumes:
      - dev_database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres"]
      interval: 5s
      timeout: 20s
      retries: 50
    
  dummy_wca:
    restart: unless-stopped
    image: maxidragon/dummy-wca:main
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    # Feel free to change this if you are not using CubingContests
    ports:
    - "${FKMTIME_DUMMY_WCA_PORT:-3005}:3000"

  dummy_wca_live:
    restart: unless-stopped
    image: maxidragon/dummy-wca-live:main
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    ports:
      - "${FKMTIME_DUMMY_WCA_LIVE_PORT:-4000}:4000"
  
  # Only one stack per machine can own the connector: it listens on port 8080
  # of the Docker VM's host network and registers a fixed mDNS name with the
  # shared docker-adapter. Extra stacks set FKMTIME_MICRO_CONNECTOR=0 to skip it.
  micro_connector:
    image: "ghcr.io/fkmtime/fkmtime-micro-connector:master"
    scale: ${FKMTIME_MICRO_CONNECTOR:-1}
    network_mode: host
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    volumes:
      - /run/dbus:/run/dbus:ro
      - sock:/app/sock
      - /tmp/fkm-build:/app/firmware
      - /tmp/fkm-logs:/logs
    environment:
      - PORT=8080
      - FIRMWARE_DIR=/app/firmware
      - RUST_LOG=none,backend=debug
      - SOCKET_PATH=/app/sock/socket.sock
      - DEVICE_LOGS=/logs
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      backend:
        condition: service_healthy

volumes:
  dev_database:
  sock:
