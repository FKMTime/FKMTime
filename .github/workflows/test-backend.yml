name: Test

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/test-backend.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/test-backend.yml'

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/fkm_time_test
  WCA_ORIGIN: http://localhost:3000
  WCA_CLIENT_ID: example-application-id
  WCA_CLIENT_SECRET: example-secret
  WCA_LIVE_API_ORIGIN: http://localhost:4000/api
jobs:
   test_backend:
      name: Backend
      runs-on: ubuntu-latest
      services:
        postgres:
          image: postgres
          env:
            POSTGRES_PASSWORD: postgres
            POSTGRES_USER: postgres
            POSTGRES_DB: fkm_time_test
          options: >-
            --health-cmd pg_isready
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5
          ports:
            - 5432:5432
        dummy-wca:
          image: maxidragon/dummy-wca:main
          env:
            # The tests expect results to go to WCA Live. FKMTime re-reads this
            # every 5 minutes, so the dummy's default (internal) would switch the
            # test competition mid-run whenever a run crosses a 5-minute mark
            GENERATED_SCORETAKING_SOFTWARE: wca_live
          ports:
            - 3000:3000

      strategy:
        matrix:
          node-version: [24.x]
      steps:
        - uses: actions/checkout@v7
        - name: Use Node.js ${{ matrix.node-version }}
          uses: actions/setup-node@v7
          with:
            node-version: ${{ matrix.node-version }}
            cache-dependency-path: "backend"
        - name: Install dependencies
          working-directory: 'backend'
          run: npm install
        - name: Run ESlint
          working-directory: 'backend'
          run: npm run lint
        - name: Check formatting
          working-directory: 'backend'
          run: npm run format:check
        - name: Generate prisma
          working-directory: 'backend'
          run: npx prisma generate
        # strictNullChecks, one file at a time (scripts/check-strict-null.mjs)
        - name: Check strictNullChecks against the baseline
          working-directory: 'backend'
          run: npm run check:strict-null
        - name: Build backend
          working-directory: 'backend'
          run: npm run build
        # What the image does at boot, so the suite runs on the schema
        # production gets rather than on `prisma db push`
        - name: Create the schema
          working-directory: 'backend'
          run: |
            node scripts/schema-sql.mjs create
            node dist/src/db/apply-schema.js
        - name: Seed test database
          working-directory: 'backend'
          run: npm run prisma:seed-test
        - name: Run E2E tests
          working-directory: 'backend'
          run: npm run test:e2e
        - name: Run unit tests
          working-directory: 'backend'
          run: npm run test:no-watch
        - name: Run script tests
          working-directory: 'backend'
          run: npm run test:scripts
