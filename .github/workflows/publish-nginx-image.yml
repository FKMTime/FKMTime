name: Publish nginx docker image

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'nginx/**'
      - 'nginx.Dockerfile'
      - '.github/workflows/publish-nginx-image.yml'
  # builds both platforms without pushing, so image changes are checked before merge
  pull_request:
    paths:
      - 'nginx.Dockerfile'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/publish-nginx-image.yml'
  repository_dispatch:
    types:
      - ghcr-image-updated
  workflow_dispatch:

      
# a newer push supersedes the image being built; queued runs also stop racing for the cache
concurrency:
  group: publish-nginx-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fkmtime/fkmtime-nginx

jobs:
   push:
      name: Push to ghcr.io
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7
        - name: Setup Docker buildx
          uses: docker/setup-buildx-action@v4
        - name: Log into registry ${{ env.REGISTRY }}
          if: github.event_name != 'pull_request'
          uses: docker/login-action@v4
          with:
            registry: ${{ env.REGISTRY }}
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
        - name: Extract Docker metadata
          id: meta
          uses: docker/metadata-action@v6
          with:
            images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        - name: Build and push Docker image
          id: build-and-push
          uses: docker/build-push-action@v7
          with:
            context: ./
            file: nginx.Dockerfile
            push: ${{ github.event_name != 'pull_request' }}
            platforms: linux/amd64, linux/arm64
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            cache-from: type=gha
            cache-to: type=gha,mode=max            
